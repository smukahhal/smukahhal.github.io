<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NegotAItor</title>
  <meta name="description" content="NegotAItor: a text-based negotiation simulator for the ICRC challenge at the Geneva {ai} Hackathon. Trainer-written rules grade every turn, and the trainer can steer the scene live.">
  <meta property="og:title" content="NegotAItor · An avatar negotiators can actually be graded against">
  <meta property="og:description" content="Our answer to the ICRC challenge at the Geneva {ai} Hackathon: character simulation, live scenario control and objective grading in one loop.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://isolie.com/negotaitor/">
  <link rel="canonical" href="https://isolie.com/negotaitor/">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <meta name="theme-color" content="#0B0F1A">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F1A;
      --surface: #111827;
      --surface-glass: rgba(17, 24, 39, 0.62);
      --surface-deep: #070A12;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --highlight: rgba(255, 255, 255, 0.06);
      --text: #E5E9F0;
      --text-body: #CBD5E1;
      --text-muted: #94A3B8;
      --text-dim: #7C8AA0;
      --cyan: #22D3EE;
      --cyan-soft: rgba(34, 211, 238, 0.12);
      --cyan-line: rgba(34, 211, 238, 0.45);
      --violet: #8B5CF6;
      --violet-soft: rgba(139, 92, 246, 0.14);
      --violet-text: #B79CFF;
      --mint: #34D399;
      --mint-soft: rgba(52, 211, 153, 0.12);
      --amber: #F59E0B;
      --amber-soft: rgba(245, 158, 11, 0.10);
      --amber-line: rgba(245, 158, 11, 0.35);
      --term-bg: #05070D;
      --term-info: #9AA6B8;
      --radius: 16px;
      --radius-sm: 10px;
      --gutter: 16px;
      --maxw: 1120px;
      --maxw-wide: 1200px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-head: "Space Grotesk", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --bar-h: 60px;
    }
    @media (min-width: 768px) { :root { --gutter: 24px; } }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--bar-h) + 16px); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .mono { font-family: var(--font-mono); }
    .wrap { width: 100%; max-width: calc(var(--maxw) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); }
    .wrap-wide { max-width: calc(var(--maxw-wide) + 2 * var(--gutter)); }
    .icon { width: 20px; height: 20px; flex: none; }

    /* ---------- shared ---------- */
    section { position: relative; padding: clamp(64px, 10vw, 112px) 0; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--cyan); margin: 0 0 16px;
    }
    h1, h2, h3 { font-family: var(--font-head); color: var(--text); margin: 0; letter-spacing: -0.03em; line-height: 1.08; }
    h2 { font-size: clamp(1.9rem, 4.2vw, 3rem); max-width: 22ch; }
    h3 { font-size: 1.15rem; letter-spacing: -0.01em; line-height: 1.3; }
    .section-sub { color: var(--text-muted); margin: 14px 0 0; max-width: 60ch; font-size: 1.05rem; }
    .section-head { margin-bottom: clamp(32px, 5vw, 48px); }
    .glass {
      background: var(--surface-glass);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 0 var(--highlight), 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    }
    .lift { transition: transform 200ms var(--ease), border-color 200ms var(--ease), box-shadow 200ms var(--ease); }
    .lift:hover { transform: translateY(-2px); border-color: var(--cyan-line); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 48px; padding: 0 22px; border-radius: 999px; cursor: pointer;
      font-weight: 600; font-size: 0.98rem; border: 1px solid transparent; text-decoration: none;
      transition: transform 180ms var(--ease), background 180ms var(--ease), border-color 180ms var(--ease), box-shadow 180ms var(--ease);
    }
    .btn:hover { transform: translateY(-2px); text-decoration: none; }
    .btn-primary { background: var(--cyan); color: #04121A; box-shadow: 0 8px 30px -10px rgba(34, 211, 238, 0.6); }
    .btn-primary:hover { box-shadow: 0 10px 36px -8px rgba(34, 211, 238, 0.75); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
    .btn-ghost:hover { border-color: var(--cyan-line); color: var(--cyan); }
    .btn .icon { width: 18px; height: 18px; }
    .btn[disabled] { opacity: 0.7; cursor: progress; transform: none; }
    .btn[disabled][data-soon] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    .seek-link {
      display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.8rem;
      color: var(--cyan); background: none; border: 0; padding: 4px 0; cursor: pointer;
    }
    .seek-link:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* reveal */
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity 600ms var(--ease), transform 600ms var(--ease); }
    .reveal.is-visible { opacity: 1; transform: none; }

    /* ---------- 0. top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 50; height: var(--bar-h);
      background: rgba(11, 15, 26, 0.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar .wrap { height: 100%; display: flex; align-items: center; gap: 16px; }
    .wordmark { font-family: var(--font-head); font-weight: 700; font-size: 1.2rem; letter-spacing: -0.02em; color: var(--text); white-space: nowrap; }
    .wordmark:hover { text-decoration: none; }
    .wordmark .ai { color: var(--cyan); }
    .badge {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); white-space: nowrap;
      border: 1px solid var(--border-strong); border-radius: 999px; padding: 4px 10px;
    }
    .nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .nav a { color: var(--text-muted); font-size: 0.9rem; padding: 8px 10px; border-radius: 8px; transition: color 150ms var(--ease); }
    .nav a:hover { color: var(--cyan); text-decoration: none; }
    .menu-btn {
      display: none; margin-left: auto; width: 44px; height: 44px; border-radius: 10px; cursor: pointer;
      background: transparent; border: 1px solid var(--border-strong); align-items: center; justify-content: center;
    }
    @media (max-width: 1020px) { .badge { display: none; } }
    @media (max-width: 860px) {
      .menu-btn { display: inline-flex; }
      .nav {
        position: absolute; top: var(--bar-h); left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0;
        background: rgba(11, 15, 26, 0.97); border-bottom: 1px solid var(--border); padding: 8px var(--gutter) 16px;
        display: none;
      }
      .nav.is-open { display: flex; }
      .nav a { padding: 12px 4px; font-size: 1rem; border-bottom: 1px solid var(--border); border-radius: 0; }
      .nav .badge-mobile { display: block; margin-top: 12px; }
    }
    .badge-mobile { display: none; }

    /* ---------- 1. hero ---------- */
    .hero { padding-top: clamp(48px, 9vw, 104px); overflow: hidden; isolation: isolate; }
    .hero::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, #000 30%, transparent 75%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, #000 30%, transparent 75%);
    }
    .hero-map {
      position: absolute; top: 0; left: 0; width: 100%; height: min(980px, 100%); z-index: -1; pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse 75% 70% at 72% 32%, #000 25%, rgba(0,0,0,.35) 60%, transparent 85%);
      mask-image: radial-gradient(ellipse 75% 70% at 72% 32%, #000 25%, rgba(0,0,0,.35) 60%, transparent 85%);
    }
    .hero-map .contour { fill: none; stroke: rgba(34, 211, 238, 0.13); stroke-width: 1; }
    .hero-map .contour.major { stroke: rgba(139, 92, 246, 0.32); stroke-width: 1.3; }
    .hero-map .road-bed { fill: none; stroke: rgba(255, 255, 255, 0.07); stroke-width: 9; stroke-linecap: round; }
    .hero-map .road-line { fill: none; stroke: rgba(34, 211, 238, 0.45); stroke-width: 1.5; stroke-dasharray: 10 12; stroke-linecap: round; }
    .hero-map .cp-glow { fill: url(#cpGlow); }
    .hero-map .cp-ring { fill: none; stroke: var(--amber); stroke-width: 1.5; opacity: 0.8; }
    .hero-map .cp-bar { stroke: var(--amber); stroke-width: 3; stroke-linecap: round; }
    .hero-map .cp-label { fill: #F3DDB5; font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.06em; opacity: 0.85; }
    .hero-map .cp-sub { fill: var(--text-dim); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; }
    @media (max-width: 1200px) { .hero-map .cp-label, .hero-map .cp-sub { display: none; } }
    @media (max-width: 720px) {
      .hero-map { height: 760px; opacity: 0.7; }
      .hero-map .cp { display: none; }
    }
    .hero::after {
      content: ""; position: absolute; top: -200px; left: 50%; width: 900px; height: 600px; transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(139, 92, 246, 0.14), transparent); pointer-events: none; z-index: -1;
    }
    .hero h1 { font-size: clamp(2.4rem, 6.4vw, 4.9rem); max-width: 17ch; letter-spacing: -0.04em; }
    .hero .sub { font-size: clamp(1.05rem, 1.8vw, 1.25rem); color: var(--text-body); max-width: 62ch; margin: 24px 0 0; }
    .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

    .gaps { margin-top: clamp(48px, 8vw, 80px); }
    .gaps-head {
      display: grid; grid-template-columns: 1fr 44px 1fr; gap: 0 12px; margin-bottom: 10px;
      font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .gaps-head .t { color: var(--amber); }
    .gaps-head .a { color: var(--cyan); grid-column: 3; }
    .gap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .gap-row { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 0 12px; align-items: stretch; padding: 10px; }
    .gap-cell { border-radius: var(--radius-sm); padding: 14px 16px; font-size: 0.95rem; line-height: 1.5; }
    .gap-cell .lbl { display: none; font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .gap-today { background: var(--amber-soft); border: 1px solid var(--amber-line); color: #F3DDB5; }
    .gap-today .lbl { color: var(--amber); }
    .gap-answer { background: var(--cyan-soft); border: 1px solid rgba(34, 211, 238, 0.3); color: var(--text); }
    .gap-answer .lbl { color: var(--cyan); }
    .gap-arrow { display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
    .gap-arrow .icon { width: 22px; height: 22px; }
    @media (max-width: 720px) {
      .gaps-head { display: none; }
      .gap-row { grid-template-columns: 1fr; gap: 6px; }
      .gap-cell .lbl { display: block; }
      .gap-arrow { transform: rotate(90deg); height: 24px; }
    }

    .stats {
      margin: clamp(32px, 5vw, 48px) 0 0; padding: 16px 0 0; list-style: none; border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
      font-family: var(--font-mono); font-size: 0.82rem; color: var(--text-muted);
    }
    .stats li { display: flex; gap: 8px; align-items: baseline; }
    .stats li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); flex: none; transform: translateY(-2px); }
    @media (max-width: 860px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 400px) { .stats { grid-template-columns: 1fr; } }

    /* ---------- 2. video ---------- */
    .showcase { padding-top: 24px; overflow-x: clip; }
    .stage { position: relative; isolation: isolate; }
    .stage-glow {
      position: absolute; inset: -6% -4%; z-index: -1; border-radius: 40px; pointer-events: none;
      background:
        radial-gradient(60% 70% at 30% 40%, rgba(139, 92, 246, 0.45), transparent 70%),
        radial-gradient(55% 65% at 75% 65%, rgba(34, 211, 238, 0.3), transparent 70%);
      filter: blur(60px); opacity: 0.55;
    }
    .showcase.is-playing .stage-glow { animation: glow 8s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.45; transform: scale(1); } 50% { opacity: 0.75; transform: scale(1.03); } }
    .frame {
      position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: var(--radius); overflow: hidden;
      background: #000; border: 1px solid var(--border-strong);
      box-shadow: 0 40px 100px -30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 0, 0, 0.4);
    }
    .frame iframe, .frame > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .poster {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; cursor: pointer; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2vw, 18px);
      background:
        radial-gradient(80% 90% at 20% 10%, rgba(139, 92, 246, 0.28), transparent 60%),
        radial-gradient(70% 80% at 90% 100%, rgba(34, 211, 238, 0.18), transparent 60%),
        linear-gradient(160deg, #0F1424, #070A12);
      color: var(--text);
    }
    .poster::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(to right, rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000, transparent 70%); mask-image: radial-gradient(circle at 50% 50%, #000, transparent 70%);
    }
    .poster > * { position: relative; }
    .poster .wordmark { font-size: clamp(1.4rem, 4vw, 2.6rem); }
    .poster-q { font-family: var(--font-mono); font-size: clamp(0.66rem, 1.4vw, 0.9rem); color: var(--text-muted); max-width: 46ch; padding: 0 16px; }
    .play-circle {
      width: clamp(64px, 11vw, 104px); height: clamp(64px, 11vw, 104px); border-radius: 50%;
      display: grid; place-items: center; background: rgba(139, 92, 246, 0.9); color: #fff;
      box-shadow: 0 0 0 10px rgba(139, 92, 246, 0.18), 0 0 60px 10px rgba(139, 92, 246, 0.55);
      transition: transform 220ms var(--ease), box-shadow 220ms var(--ease);
    }
    .play-circle .icon { width: 38%; height: 38%; transform: translateX(6%); }
    .poster:hover .play-circle { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(139, 92, 246, 0.22), 0 0 80px 16px rgba(139, 92, 246, 0.6); }
    .poster:focus-visible { outline-offset: -4px; }
    .poster-len { font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-muted); border: 1px solid var(--border-strong); border-radius: 999px; padding: 2px 10px; }
    .poster.is-empty { cursor: default; }
    .poster.is-empty .play-circle { background: rgba(139, 92, 246, 0.35); box-shadow: 0 0 0 10px rgba(139, 92, 246, 0.08); }
    .soon { font-family: var(--font-mono); font-size: 0.8rem; color: var(--amber); }
    @media (max-width: 480px) {
      .poster { gap: 6px; }
      .play-circle { width: 52px; height: 52px; box-shadow: 0 0 0 6px rgba(139, 92, 246, 0.18), 0 0 36px 6px rgba(139, 92, 246, 0.5); }
      .poster .wordmark { font-size: 1.25rem; }
    }
    .video-note { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim); margin: 12px 0 0; text-align: center; }

    /* ---------- 3. chapters ---------- */
    .chapters { margin-top: 24px; }
    .rail { position: relative; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); margin: 0 0 16px; }
    .rail-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: width 500ms linear; }
    .rail-tick { position: absolute; top: -3px; width: 2px; height: 10px; border-radius: 2px; background: var(--text-dim); transform: translateX(-1px); }
    .rail-tick.is-active { background: var(--cyan); }
    .chapter-list { position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .chapter {
      width: 100%; min-height: 56px; text-align: left; cursor: pointer; padding: 10px 14px; border-radius: 12px;
      background: var(--surface-glass); border: 1px solid var(--border); color: var(--text-body); font-size: 0.88rem; line-height: 1.35;
      transition: background 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease), transform 180ms var(--ease);
    }
    .chapter:hover { border-color: var(--cyan-line); transform: translateY(-2px); }
    .chapter .ts { display: block; font-family: var(--font-mono); font-size: 0.76rem; color: var(--cyan); margin-bottom: 2px; }
    .chapter[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: #04121A; font-weight: 600; }
    .chapter[aria-pressed="true"] .ts { color: #04323D; }
    @media (max-width: 720px) {
      .chapter-list {
        display: flex; overflow-x: auto; scroll-snap-type: x proximity; gap: 8px; padding-bottom: 8px; scrollbar-width: thin;
      }
      .chapter-list li { flex: none; scroll-snap-align: start; }
      .chapter { width: auto; white-space: nowrap; border-radius: 999px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; }
      .chapter .ts { display: inline; margin: 0; }
    }

    /* ---------- 4. TL;DW ---------- */
    .tldw-title { font-family: var(--font-mono); font-size: clamp(2.4rem, 6vw, 4rem); letter-spacing: -0.04em; font-weight: 600; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .hl-card { padding: 26px; display: flex; flex-direction: column; gap: 10px; }
    .hl-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--cyan-soft); color: var(--cyan); border: 1px solid rgba(34, 211, 238, 0.25); margin-bottom: 6px; }
    .hl-icon .icon { width: 22px; height: 22px; }
    .hl-card p { margin: 0; color: var(--text-muted); }
    .hl-card .seek-link { margin-top: auto; padding-top: 8px; align-self: flex-start; }
    @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ---------- 5. loop ---------- */
    .loop-wrap { position: relative; padding-bottom: 44px; }
    .loop { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; position: relative; }
    .loop li { position: relative; padding-top: 4px; }
    .loop-node {
      width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
      font-family: var(--font-mono); font-weight: 600; color: var(--cyan); background: var(--bg);
      border: 1px solid var(--cyan-line); box-shadow: 0 0 24px -6px rgba(34, 211, 238, 0.5);
    }
    .loop li:not(:last-child)::after {
      content: ""; position: absolute; top: 28px; left: 56px; right: -8px; height: 1px;
      background: linear-gradient(90deg, var(--cyan-line), rgba(34, 211, 238, 0.12));
    }
    .loop h3 { margin: 16px 0 6px; }
    .loop p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
    .loop-return {
      position: absolute; left: 24px; right: calc(25% - 36px); bottom: 6px; height: 22px;
      border: 1px dashed rgba(34, 211, 238, 0.35); border-top: 0; border-radius: 0 0 14px 14px;
    }
    .loop-return::before {
      content: ""; position: absolute; left: -5px; top: -2px; width: 0; height: 0;

    // A page opened from file:// sends no referrer, so YouTube refuses to embed. Open YouTube instead.
    const canEmbed = !(video && video.provider === "youtube") || /^https?:$/.test(location.protocol);
    const watchUrl = (t) => `https://www.youtube.com/watch?v=${video.id}&t=${Math.floor(t || 0)}s`;
    const Player = {
      loaded: false, ready: false, playing: false, api: null, pending: null, timer: null,
      load(t) {
        if (!video) return;
        this.loaded = true;
        this.pending = t || 0;
        frame.textContent = "";
        const start = Math.floor(t || 0);
        if (video.provider === "youtube") {
          // Build the iframe ourselves so it always sends a referrer (YouTube shows error 153 without one).
          const q = new URLSearchParams({ autoplay: "1", rel: "0", playsinline: "1", enablejsapi: "1", start: String(start), origin: location.origin });
          const iframe = h("iframe", {
            id: "ytPlayer", src: `https://www.youtube.com/embed/${video.id}?${q}`, title: U.demoTitle,
            allow: "autoplay; encrypted-media; picture-in-picture; fullscreen", allowfullscreen: true,
            referrerpolicy: "strict-origin-when-cross-origin"
          });
          frame.append(iframe);
          loadYouTubeApi().then((YT) => {
            this.api = new YT.Player(iframe, {
              events: {
                onReady: (e) => { this.ready = true; if (this.pending) e.target.seekTo(this.pending, true); e.target.playVideo(); this.pending = null; },
                onStateChange: (e) => this.setPlaying(e.data === YT.PlayerState.PLAYING)
              }
            });
          }).catch(() => this.fail());
        } else if (video.provider === "vimeo") {
          const q = new URLSearchParams({ autoplay: "1", title: "0", byline: "0", portrait: "0", dnt: "1" });
          if (video.hash) q.set("h", video.hash);
          const iframe = h("iframe", {
            src: `https://player.vimeo.com/video/${video.id}?${q}#t=${start}s`, title: U.demoTitle,
            allow: "autoplay; fullscreen; picture-in-picture", allowfullscreen: true
          });
          frame.append(iframe);
          loadScript("https://player.vimeo.com/api/player.js").then(() => {
            this.api = new window.Vimeo.Player(iframe);
            this.api.ready().then(() => { this.ready = true; if (this.pending) this.api.setCurrentTime(this.pending); this.pending = null; });
            this.api.on("play", () => this.setPlaying(true));
            this.api.on("pause", () => this.setPlaying(false));
            this.api.on("ended", () => this.setPlaying(false));
          }).catch(() => { /* iframe still plays; chapters fall back to reloading */ });
        } else if (video.provider === "loom") {
          this.loomEmbed(start);
        }
      },
      loomEmbed(t) {
        frame.textContent = "";
        frame.append(h("iframe", {
          src: `https://www.loom.com/embed/${video.id}?autoplay=1&hide_owner=true&hide_share=true&hideEmbedTopBar=true&t=${Math.floor(t)}`,
          title: U.demoTitle, allow: "autoplay; fullscreen", allowfullscreen: true
        }));
        this.ready = true;
        showcase.classList.add("is-playing"); // no events from Loom; assume it plays
      },
      play(t) {
        if (!video) return;
        if (!canEmbed) { window.open(watchUrl(t), "_blank", "noopener"); return; }
        if (!this.loaded) return this.load(t);
        if (video.provider === "loom") return this.loomEmbed(t || 0);
        if (!this.ready || !this.api) { this.pending = t; return; }
        if (video.provider === "youtube") { this.api.seekTo(t || 0, true); this.api.playVideo(); }
        else this.api.setCurrentTime(t || 0).then(() => this.api.play()).catch(() => {});
      },
      getTime() {
        if (!this.api) return Promise.resolve(null);
        if (video.provider === "youtube") return Promise.resolve(this.api.getCurrentTime ? this.api.getCurrentTime() : null);
        return this.api.getCurrentTime().catch(() => null);
      },
      setPlaying(on) {
        this.playing = on;
        showcase.classList.toggle("is-playing", on);
        clearInterval(this.timer);
        if (on) this.timer = setInterval(() => this.getTime().then((s) => { if (s != null) syncToTime(s); }), 500);
      },
      fail() {
        this.loaded = false;
        frame.textContent = "";
        renderPoster();
        showNote(U.videoError);
      }
    };

    function showNote(text) { const n = $("videoNote"); n.textContent = text; n.hidden = false; }

    function renderPoster() {
      const empty = !video;
      const poster = h("button", {
        class: "poster" + (empty ? " is-empty" : ""), type: "button",
        "aria-label": empty ? U.comingSoon : U.playLabel + " (" + fmt(duration) + ")",
        "aria-disabled": empty ? "true" : null,
        onclick: () => { if (!empty) Player.play(0); }
      },
        h("span", { class: "wordmark" }, wordmark()),
        h("span", { class: "poster-q", text: U.question }),
        h("span", { class: "play-circle" }, icon("play")),
        empty ? h("span", { class: "soon", text: U.comingSoon }) : h("span", { class: "poster-len", text: fmt(duration) })
      );
      frame.append(poster);
    }
    renderPoster();
    if (!canEmbed) showNote(U.fileNote);

    /* ---------- 3. chapters ---------- */
    const chapterList = $("chapters"), rail = $("rail"), railFill = $("railFill");
    chapterList.setAttribute("aria-label", U.chaptersLabel);
    const chapterBtns = CONTENT.chapters.map((c, i) => {
      const btn = h("button", { class: "chapter", type: "button", "aria-pressed": "false", onclick: () => seek(c.t) },
        h("span", { class: "ts", text: fmt(c.t) }), c.label);
      chapterList.append(h("li", null, btn));
      rail.append(h("span", { class: "rail-tick", style: `left:${Math.min(100, (c.t / duration) * 100)}%`, "data-i": i }));
      return btn;
    });
    const ticks = rail.querySelectorAll(".rail-tick");
    let activeIdx = -1;
    function setActive(i) {
      if (i === activeIdx) return;
      activeIdx = i;
      chapterBtns.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
      ticks.forEach((t, j) => t.classList.toggle("is-active", j === i));
      const b = chapterBtns[i];
      if (b && window.matchMedia("(max-width: 720px)").matches) {
        const list = chapterList, li = b.parentElement;
        list.scrollTo({ left: li.offsetLeft - list.clientWidth / 2 + li.clientWidth / 2, behavior: reduceMotion ? "auto" : "smooth" });
      }
    }
    function chapterAt(s) {
      let idx = 0;
      CONTENT.chapters.forEach((c, i) => { if (s >= c.t) idx = i; });
      return idx;
    }
    function syncToTime(s) {
      setActive(chapterAt(s));
      railFill.style.width = Math.min(100, (s / duration) * 100) + "%";
    }
    function seek(t) {
      setActive(chapterAt(t));
      railFill.style.width = Math.min(100, (t / duration) * 100) + "%";
      if (!video) { showNote(U.comingSoon); return; }
      Player.play(t);
    }
    function jumpTo(t) {
      showcase.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      seek(t);
    }
    $("watchBtn").addEventListener("click", () => jumpTo(Player.loaded ? (activeIdx >= 0 ? CONTENT.chapters[activeIdx].t : 0) : 0));

    const seekLink = (t, text) => h("a", {
      class: "seek-link", href: "#demo", "aria-label": `${text} ${fmt(t)} in the demo video`,
      onclick: (e) => { e.preventDefault(); jumpTo(t); }
    }, text);

    /* ---------- 4. TL;DW ---------- */
    $("tldwTitle").textContent = U.tldwTitle;
    $("tldwSub").textContent = U.tldwSub;
    CONTENT.highlights.forEach((hl) => $("highlightGrid").append(
      h("article", { class: "hl-card glass lift reveal" },
        h("div", { class: "hl-icon" }, icon(hl.icon)),
        h("h3", { text: hl.title }),
        h("p", { text: hl.text }),
        hl.chapter != null ? seekLink(hl.chapter, `${U.seeIt} ${fmt(hl.chapter)} →`) : null)));

    /* ---------- 5. loop + widget ---------- */
    $("loopEyebrow").textContent = U.loopEyebrow;
    $("loopTitle").textContent = U.loopTitle;
    const loopEl = $("loopSteps");
    CONTENT.loop.forEach((s, i) => loopEl.append(h("li", null,
      h("span", { class: "loop-node", "aria-hidden": "true", text: String(i + 1) }),
      h("div", null, h("h3", null, h("span", { class: "sr-only", text: `Step ${i + 1}: ` }), s.title), h("p", { text: s.text })))));
    $("loopReturn").append(h("span", { text: "↺ " + U.loopBack }));

    const widget = $("widget");
    const meters = {};
    const meter = (m, cls) => {
      const val = h("span", { class: "meter-val" }), fillEl = h("div", { class: "meter-fill" });
      const el = h("div", { class: "meter " + (cls || "") },
        h("div", { class: "meter-top" }, h("span", { text: m.label }), val),
        h("div", { class: "meter-track", role: "presentation" }, fillEl));
      meters[m.id] = { el, val, fill: fillEl, def: m };
      return el;
    };
    widget.append(
      h("div", { class: "widget-head" }, h("h3", { text: U.widgetTitle }), h("span", { class: "live", text: U.widgetLive })),
      h("div", { class: "widget-cols" },
        h("div", { class: "widget-col" }, h("h3", { text: U.widgetDials }), CONTENT.widget.dials.map((d) => meter(d, d.warn ? "is-tension" : ""))),
        h("div", { class: "widget-col" }, h("h3", { text: U.widgetCriteria }), CONTENT.widget.criteria.map((c) => meter(c, "is-grade")))),
      h("p", { class: "widget-foot" }, U.widgetFoot + " ", h("a", { href: "#logs", text: "↓" })));

    function setDial(id, value, delta) {
      const m = meters[id]; if (!m) return;
      m.fill.style.width = Math.max(0, Math.min(100, value)) + "%";
      m.val.textContent = String(value);
      if (delta) {
        const good = m.def.warn ? delta < 0 : delta > 0;
        const cls = good ? "flash-up" : "flash-warn";
        m.el.classList.add(cls);
        setTimeout(() => m.el.classList.remove(cls), 1400);
      }
    }
    function setGrade(id, score) {
      const m = meters[id]; if (!m) return;
      if (score == null) { m.fill.style.width = "0%"; m.val.textContent = "–/10"; m.el.classList.remove("is-set"); return; }
      m.fill.style.width = score * 10 + "%";
      m.val.textContent = score + "/10";
      m.el.classList.add("is-set");
    }
    function resetWidget() {
      CONTENT.widget.dials.forEach((d) => setDial(d.id, d.start));
      CONTENT.widget.criteria.forEach((c) => setGrade(c.id, null));
    }
    resetWidget();

    /* ---------- 6. brief ---------- */
    $("briefEyebrow").textContent = U.briefEyebrow;
    $("briefTitle").textContent = U.briefTitle;
    $("briefSub").textContent = U.briefSub;
    CONTENT.brief.forEach((b) => $("briefGrid").append(
      h("article", { class: "brief-card glass lift reveal" },
        h("div", { class: "brief-top" },
          h("span", { class: "check", "aria-hidden": "true" }, icon("check")),
          h("p", { class: "brief-req" }, h("span", { class: "sr-only", text: "Requirement met: " }), "“" + b.req + "”")),
        h("p", { class: "how", text: b.how }),
        b.chapter != null ? seekLink(b.chapter, "▶ " + fmt(b.chapter)) : null)));

    /* ---------- 7. stack ---------- */
    $("stackEyebrow").textContent = U.stackEyebrow;
    $("stackTitle").textContent = U.stackTitle;
    const groupIcons = ["window", "server", "chip"];
    Object.entries(CONTENT.stack).forEach(([group, items], gi) => $("stackGroups").append(
      h("div", { class: "stack-group reveal" },
        h("h3", { class: "group-label", text: group }),
        h("ul", { class: "grid-4" }, items.map((it) => h("li", { class: "stack-card glass lift" },
          h("span", { class: "ic", "aria-hidden": "true" }, icon(groupIcons[gi % groupIcons.length])),
          h("div", null, h("strong", { text: it.name }), h("span", { text: it.role }))))))));
    const arch = $("arch");
    arch.setAttribute("aria-label", "Architecture: " + CONTENT.architecture.join(" to "));
    CONTENT.architecture.forEach((part, i) => {
      if (i) arch.append(h("span", { class: "sep", "aria-hidden": "true", text: "⇄" }));
      const m = part.match(/^(.*?)(\(.*\))$/);
      if (m) arch.append(m[1], h("span", { class: "roles", text: m[2] }));
      else arch.append(part);
    });
    $("pills").append(h("span", { class: "pills-label", text: U.runsAnywhere }),
      ...CONTENT.runsAnywhere.map((p) => h("span", { class: "pill" }, icon("check"), p)));

    /* ---------- 8. terminal ---------- */
    $("logsEyebrow").textContent = U.logsEyebrow;
    $("logsTitle").textContent = U.logsTitle;
    $("logsSub").textContent = U.logsSub;
    $("termTitle").textContent = U.termTitle;
    const term = $("termBody");
    const MAX_LINES = 14;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const whileHidden = async () => { while (document.hidden) await new Promise((r) => document.addEventListener("visibilitychange", r, { once: true })); };
    const cursor = h("span", { class: "cursor", "aria-hidden": "true" });

    function parseLine(raw) {
      const m = raw.match(/^(\w+)\s+(.*)$/);
      return m ? { level: m[1], msg: m[2], raw } : { level: "INFO", msg: raw, raw };
    }
    function applyEffects(raw) {
      let m = raw.match(/^DIAL\s+(\w+)\s+([+\-−]\d+)\s+\((\d+)\s*→\s*(\d+)\)/);
      if (m) return setDial(m[1], parseInt(m[4], 10), parseInt(m[2].replace("−", "-"), 10));
      m = raw.match(/^GRADE\s+(\w+)\s+(\d+)\/10/);
      if (m) setGrade(m[1], parseInt(m[2], 10));
    }
    function newLine(p) {
      const msg = h("span", { class: "msg" });
      const line = h("div", { class: "term-line lv-" + p.level }, h("span", { class: "lvl", text: p.level }), msg);
      term.append(line);
      while (term.children.length > MAX_LINES) term.firstElementChild.remove();
      term.scrollTop = term.scrollHeight;
      return msg;
    }

    async function runTerminal() {
      for (;;) {
        term.textContent = "";
        resetWidget();
        for (const raw of CONTENT.logs) {
          await whileHidden();
          const p = parseLine(raw);
          const msg = newLine(p);
          msg.after(cursor);
          for (let i = 1; i <= p.msg.length; i++) {
            await whileHidden();
            msg.textContent = p.msg.slice(0, i);
            await sleep(12);
          }
          term.scrollTop = term.scrollHeight;
          applyEffects(raw);
          await sleep(400 + Math.random() * 800);
        }
        await sleep(3000);
      }
    }
    function printAll() {
      term.textContent = "";
      CONTENT.logs.forEach((raw) => { newLine(parseLine(raw)).textContent = parseLine(raw).msg; applyEffects(raw); });
      term.lastElementChild && term.lastElementChild.append(cursor);
    }
    if (reduceMotion) printAll();
    else if ("IntersectionObserver" in window) {
      let started = false;
      const io = new IntersectionObserver((entries) => {
        if (!started && entries.some((e) => e.isIntersecting)) { started = true; io.disconnect(); runTerminal(); }
      }, { threshold: 0.3 });
      io.observe(term);
    } else runTerminal();

    /* ---------- 9. contact form ---------- */
    const F = U.form;
    $("contactTitle").textContent = U.contactTitle;
    $("contactSub").textContent = U.contactSub;
    $("l-name").textContent = F.name;
    $("l-email").textContent = F.email;
    $("l-org").textContent = F.org + " ";
    $("l-org").append(h("span", { class: "opt", text: F.optional }));
    $("l-msg").textContent = F.message;
    const form = $("contactForm"), sendBtn = $("sendBtn"), formMsg = $("formMsg"), msgBox = $("f-msg"), counter = $("c-msg");
    const formReady = !isPlaceholder(CONTENT.contact.formspreeId);
    const action = formReady ? "https://formspree.io/f/" + encodeURIComponent(CONTENT.contact.formspreeId.trim()) : "";
    if (formReady) form.action = action;
    $("f-subject").value = CONTENT.contact.subject;
    const MAXC = parseInt(msgBox.getAttribute("maxlength"), 10) || 2000;
    const setSendLabel = (busy) => {
      sendBtn.textContent = "";
      if (busy) sendBtn.append(h("span", { class: "spinner", "aria-hidden": "true" }), F.sending);
      else sendBtn.append(F.send);
      sendBtn.disabled = busy;
    };
    setSendLabel(false);
    if (!formReady) { sendBtn.disabled = true; sendBtn.setAttribute("data-soon", ""); }
    const updateCount = () => { counter.textContent = `${msgBox.value.length} / ${MAXC}`; };
    msgBox.addEventListener("input", updateCount); updateCount();

    const rules = [
      { el: $("f-name"), err: $("e-name"), text: F.errName, ok: (v) => v.trim().length > 0 },
      { el: $("f-email"), err: $("e-email"), text: F.errEmail, ok: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) },
      { el: msgBox, err: $("e-msg"), text: F.errMsg, ok: (v) => v.trim().length > 0 }
    ];
    const showErr = (r, bad) => { r.el.setAttribute("aria-invalid", String(bad)); r.err.hidden = !bad; r.err.textContent = bad ? r.text : ""; };
    rules.forEach((r) => r.el.addEventListener("input", () => { if (r.el.getAttribute("aria-invalid") === "true" && r.ok(r.el.value)) showErr(r, false); }));

    function setMsg(kind, text, withFallback) {
      formMsg.textContent = "";
      formMsg.className = "form-msg " + (kind === "error" ? "is-error" : "is-note");
      [].concat(text).forEach((t, i) => { if (i) formMsg.append(h("br")); formMsg.append(t); });
      if (withFallback && !isPlaceholder(CONTENT.contact.fallbackEmail)) {
        const addr = CONTENT.contact.fallbackEmail;
        formMsg.append(h("br"), F.fallback + " ", h("a", { href: "mailto:" + addr, text: addr }), ".");
      }
      formMsg.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      let firstBad = null;
      rules.forEach((r) => { const bad = !r.ok(r.el.value); showErr(r, bad); if (bad && !firstBad) firstBad = r.el; });
      if (firstBad) { firstBad.focus(); return; }
      if (!formReady) return;
      formMsg.hidden = true;
      setSendLabel(true);
      try {
        const res = await fetch(action, { method: "POST", body: new FormData(form), headers: { "Accept": "application/json" } });
        if (!res.ok) {
          const data = await res.json().catch(() => null);
          const errs = data && Array.isArray(data.errors) ? data.errors.map((x) => x.message).filter(Boolean) : [];
          const err = new Error("HTTP " + res.status);
          err.details = errs;
          throw err;
        }
        const card = $("formCard");
        card.textContent = "";
        const ok = h("div", { class: "form-success", role: "status", tabindex: "-1" },
          h("div", { class: "ok", "aria-hidden": "true" }, icon("check")), h("p", { text: F.success }));
        card.append(ok);
        ok.focus();
      } catch (err) {
        setSendLabel(false);
        setMsg("error", err.details && err.details.length ? err.details : F.failure, true);
      }
    });
    if (!formReady) setMsg("note", F.soon);

    /* ---------- 10. team + footer ---------- */
    $("teamTitle").textContent = U.teamTitle;
    const tp = CONTENT.teamPhoto;
    if (tp && !isPlaceholder(tp.src)) {
      const fig = $("teamPhoto");
      fig.append(h("img", { src: tp.src, alt: tp.alt || "", loading: "lazy", decoding: "async", width: "2048", height: "1536", onerror: () => { fig.hidden = true; } }));
      fig.hidden = false;
    }
    const initials = (name) => {
      const parts = name.trim().normalize("NFC").split(/\s+/);
      const first = (w) => Array.from(w)[0] || "";
      return (first(parts[0]) + (parts.length > 1 ? first(parts[parts.length - 1]) : "")).toLocaleUpperCase();
    };
    const hue = (s) => { let x = 0; for (const ch of s) x = (x * 31 + ch.codePointAt(0)) >>> 0; return x % 360; };
    function initialsAvatar(av, name) {
      const a = hue(name), b = (a + 50) % 360;
      av.textContent = "";
      av.style.background = `linear-gradient(135deg, hsl(${a} 65% 45%), hsl(${b} 70% 32%))`;
      av.append(h("span", { class: "initials", "aria-hidden": "true", text: initials(name) }));
    }
    CONTENT.team.forEach((m) => {
      const av = h("div", { class: "avatar" });
      if (isPlaceholder(m.photo)) initialsAvatar(av, m.name);
      else av.append(h("img", { src: m.photo, alt: "", loading: "lazy", decoding: "async", width: "96", height: "96", onerror: () => initialsAvatar(av, m.name) }));
      $("teamGrid").append(h("li", { class: "team-card glass lift reveal" },
        av,
        h("strong", { text: m.name }),
        isPlaceholder(m.role) ? null : h("span", { class: "role", text: m.role }),
        isPlaceholder(m.linkedin) ? null : h("a", { class: "icon-link", href: m.linkedin, target: "_blank", rel: "noopener", "aria-label": m.name + " on LinkedIn" }, icon("linkedin"))));
    });

    const row = $("submitRow"), L = CONTENT.links;
    if (!isPlaceholder(L.github)) row.append(h("a", { class: "btn btn-ghost", href: L.github, target: "_blank", rel: "noopener" }, icon("github"), U.github));
    if (!isPlaceholder(L.devpost)) row.append(h("a", { class: "btn btn-ghost", href: L.devpost, target: "_blank", rel: "noopener" }, icon("devpost"), U.devpost));
    if (!isPlaceholder(L.liveApp)) row.append(h("a", { class: "live-link", href: L.liveApp, target: "_blank", rel: "noopener", text: U.tryLive }));
    const pr = CONTENT.project;
    const brand = $("footBrand");
    brand.append(`${U.builtAt} ${pr.hackathon} · ${pr.challenge}`, h("br"),
      [isPlaceholder(pr.year) ? null : "© " + pr.year, "Team " + pr.team, isPlaceholder(pr.license) ? null : pr.license + " License"].filter(Boolean).join(" · "));

    /* ---------- scroll reveals ---------- */
    const reveals = document.querySelectorAll(".reveal");
    if (reduceMotion || !("IntersectionObserver" in window)) reveals.forEach((el) => el.classList.add("is-visible"));
    else {
      const ro = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add("is-visible"); ro.unobserve(e.target); }
      }), { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
      reveals.forEach((el) => ro.observe(el));
    }
  })();
  </script>
</body>
</html>
